name: Capstone CI
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements-course.txt -r sentiment-service/requirements.txt
      - run: python -m py_compile backend/config/*.py backend/dealership/*.py sentiment-service/app.py
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm install --prefix dealer-service && node --check dealer-service/server.js
      - run: docker compose config
